name: Build MetaSystem Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  job_build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Forçamos a instalação do Flask e Dotenv explicitamente ANTES do requirements
          pip install flask python-dotenv waitress pandas numpy==1.26.4
          pip install -r requirements.txt
          pip install pyinstaller
          # Verificação de Sênior: lista o que foi instalado para conferirmos no log
          pip list

      - name: Build Executable
        run: |
          # --add-data inclui suas pastas de interface no .exe
          # No Windows do GitHub, o separador é ;
          pyinstaller --onefile --noconsole --name "Meta_System_Windows" --add-data "templates;templates" --add-data "static;static" app.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meta_System_Windows
          path: dist/Meta_System_Windows.exe