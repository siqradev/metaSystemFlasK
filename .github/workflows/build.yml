name: build-windows
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask waitress python-dotenv pandas openpyxl pyinstaller
    - name: Generate EXE
      run: |
        python -m PyInstaller --noconfirm --onefile --windowed --add-data "templates;templates" --add-data "static;static" --name "Meta_System_Cagece" app.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Meta_System_Windows
        path: dist/Meta_System_Cagece.exe