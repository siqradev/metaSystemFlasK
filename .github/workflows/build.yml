name: build
on:
  push:
    branches: [ main ]

jobs:
  job_build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Libs
        run: |
          python -m pip install --upgrade pip
          pip install flask waitress python-dotenv pandas openpyxl pyinstaller

      - name: EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "templates;templates" --add-data "static;static" --name "Meta_System_Cagece" app.py

      - name: Save
        uses: actions/upload-artifact@v4
        with:
          name: Meta_System_Windows
          path: dist/Meta_System_Cagece.exe
