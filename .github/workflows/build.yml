name: Build MetaSystem Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  job_build:
    runs-on: windows-latest  # ISSO GERA O .EXE
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable
        run: |
          # Se o seu arquivo principal não for app.py, mude o nome abaixo
          pyinstaller --onefile --noconsole --name "Meta_System_Windows" app.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meta_System_Windows
          path: dist/Meta_System_Windows.exe