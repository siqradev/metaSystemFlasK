name: Build MetaSystem

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  job_build:
    runs-on: ubuntu-latest
    env:
      # Resolve o aviso do Node.js 20/24
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      # Atualizado para v4 para evitar erros de versão do Node
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Init Test
        run: |
          # Criamos um .env falso para o GitHub não tentar ler o seu W:\ real
          echo "DATABASE_URL=test_db.db" > .env
          python -c "from models.database import init_db; init_db()"