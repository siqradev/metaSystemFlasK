name: MetaSystem CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  job_build:
    runs-on: ubuntu-latest
    env:
      # AJUSTE 1: Resolve o aviso do Node.js 24 conforme o log sugeriu
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      # AJUSTE 2: Usar v4 ou v5 garante compatibilidade com Node 20+
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Garante que o Git pegue o histórico corretamente

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Init Database Test
        run: |
          # AJUSTE 3: Criamos um .env temporário para o GitHub não tentar ler o seu W:\
          echo "DATABASE_URL=database_test.db" > .env
          python -c "from models.database import init_db; init_db()"